<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后宫妃子详情系统</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin:0;
    padding:20px;
    background:#f5f6fa;
    color:#333;
}

.login-overlay{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,0.7);
    display:flex;
    align-items:center;
    justify-content:center;
}

.login-box{
    background:#fff;
    padding:40px;
    border-radius:12px;
    min-width:300px;
    text-align:center;
}

table{
    width:100%;
    border-collapse:collapse;
    background:#fff;
}

th,td{
    padding:12px;
    border-bottom:1px solid #eee;
    vertical-align:top;
}

th{background:#34495e;color:#fff;}

.btn{
    padding:6px 10px;
    border:none;
    cursor:pointer;
    border-radius:4px;
    color:#fff;
}

.btn-sm{font-size:12px;}

.btn-danger{background:#e74c3c;}
.btn-success{background:#2ecc71;}
.btn-pink{background:#e91e8c;}
.btn-grey{background:#95a5a6;}

textarea{
    width:160px;
    min-height:40px;
    resize:none;
    overflow:hidden;
}
</style>

</head>

<body>

<div class="login-overlay" id="login-overlay">
    <div class="login-box">
        <h2>后宫系统登录</h2>
        <input type="password" id="pw">
        <button onclick="login()">进入</button>
    </div>
</div>

<div id="main" style="display:none;">

<table>
<thead>
<tr>
    <th>名字</th>
    <th>位份</th>
    <th>时间</th>
    <th>操作</th>
    <th>备注</th>
</tr>
</thead>

<tbody id="tb"></tbody>
</table>

</div>

<script>

let pw = '';

function headers(){
    return {
        'Content-Type':'application/json',
        'x-password':pw
    };
}

async function login(){
    const v = document.getElementById('pw').value;

    const res = await fetch('/api/login',{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify({password:v})
    });

    const d = await res.json();

    if(d.success){
        pw = v;
        document.getElementById('login-overlay').style.display='none';
        document.getElementById('main').style.display='block';
        load();
    }
}

async function load(){
    const res = await fetch('/api/state',{headers:headers()});
    const data = await res.json();
    render(data.concubines);
}

async function update(id,fields){
    const res = await fetch('/api/concubine/update',{
        method:'POST',
        headers:headers(),
        body:JSON.stringify({id,...fields})
    });

    const d = await res.json();
    render(d.concubines);
}

async function handleBirth(id,type){

    const fields = {
        isPregnant:false
    };

    if(type === 'son'){
        fields.hasSon = true;
    }

    await update(id,fields);
}

async function handleDelete(id,name){

    if(!confirm(`确定删除【${name}】？`)) return;

    const res = await fetch('/api/concubine/delete',{
        method:'POST',
        headers:headers(),
        body:JSON.stringify({id})
    });

    const d = await res.json();
    render(d.concubines);
}

function autoResize(el){
    el.style.height='auto';
    el.style.height=el.scrollHeight+'px';
}

function render(list){

    const tb = document.getElementById('tb');
    tb.innerHTML='';

    list.forEach(c=>{

        const tr = document.createElement('tr');

        tr.innerHTML=`
            <td><b>${c.name}</b></td>

            <td>
                <select onchange="update(${c.id},{title:this.value})">
                    <option ${c.title==='贵人'?'selected':''}>贵人</option>
                    <option ${c.title==='嫔'?'selected':''}>嫔</option>
                    <option ${c.title==='妃'?'selected':''}>妃</option>
                </select>
            </td>

            <td>${c.enterYear}年${c.enterMonth}月</td>

            <td>

                <div>

                    ${!c.isPregnant ? `
                        <button class="btn btn-sm"
                            onclick="update(${c.id},{isPregnant:true})">
                            怀孕
                        </button>
                    ` : `
                        <button class="btn btn-sm btn-success"
                            onclick="handleBirth(${c.id},'son')">
                            👶 皇子
                        </button>

                        <button class="btn btn-sm btn-pink"
                            onclick="handleBirth(${c.id},'daughter')">
                            👧 女子
                        </button>
                    `}

                    <button class="btn btn-sm btn-danger"
                        onclick="handleDelete(${c.id},'${c.name}')">
                        删除
                    </button>

                </div>

            </td>

            <td>
                <textarea
                    oninput="autoResize(this)"
                    onchange="update(${c.id},{note:this.value})"
                >${c.note||''}</textarea>
            </td>
        `;

        tb.appendChild(tr);
    });
}

</script>

</body>
</html>

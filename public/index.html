<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>后宫妃子详情系统</title>

<style>
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 0;
    padding: 20px;
    background: #f5f6fa;
    color: #333;
}

.login-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 999;
}

.login-box {
    background: #fff;
    padding: 40px;
    border-radius: 12px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.2);
    text-align: center;
    min-width: 300px;
}

.login-box input {
    width: 100%;
    padding: 12px;
    border: 1px solid #ccc;
    border-radius: 6px;
}

.login-box button {
    width: 100%;
    padding: 12px;
    background: #3498db;
    color: white;
    border: none;
    border-radius: 6px;
}

.header-section {
    display: flex;
    align-items: center;
    gap: 20px;
    margin-bottom: 20px;
    background: #fff;
    padding: 15px 20px;
    border-radius: 8px;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: #fff;
}

th, td {
    padding: 14px;
    border-bottom: 1px solid #eee;
    vertical-align: top;
}

th {
    background: #34495e;
    color: white;
}

.btn {
    padding: 8px 12px;
    border: none;
    border-radius: 4px;
    cursor: pointer;
}

.btn-danger { background: #e74c3c; color: white; }
.btn-success { background: #2ecc71; color: white; }
.btn-grey { background: #95a5a6; color: white; }

.inputs-group {
    display: flex;
    flex-direction: column;
    gap: 6px;
}

textarea {
    width: 180px;
    min-height: 40px;
    resize: none;
    overflow: hidden;
}
</style>
</head>

<body>

<!-- LOGIN -->
<div class="login-overlay" id="login-overlay">
    <div class="login-box">
        <h2>后宫系统</h2>
        <input type="password" id="login-input" placeholder="密码"
               onkeydown="if(event.key==='Enter') doLogin()">
        <button onclick="doLogin()">进入</button>
    </div>
</div>

<!-- MAIN -->
<div id="main-content" style="display:none;">

<div class="header-section">
    <h1 id="time-display">0年0月</h1>
    <button class="btn btn-success" onclick="window.location.href='form.html'">新增妃子</button>
</div>

<table>
<thead>
<tr>
    <th>名字</th>
    <th>位份</th>
    <th>入宫时间</th>
    <th>侍寝次数</th>
    <th>操作</th>
    <th>备注</th>
</tr>
</thead>

<tbody id="concubine-table-body"></tbody>
</table>

</div>

<script>
const titlesOrder = ["官女子","答应","常在","贵人","嫔","贵嫔","妃","贵妃","皇贵妃","皇后"];

let sessionPassword = '';
let currentYear = 1;
let currentMonth = 1;

function apiHeaders() {
    return {
        'Content-Type': 'application/json',
        'x-password': sessionPassword
    };
}

async function doLogin() {
    const pw = document.getElementById('login-input').value;

    const res = await fetch('/api/login', {
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body: JSON.stringify({password: pw})
    });

    const data = await res.json();

    if(data.success){
        sessionPassword = pw;
        sessionStorage.setItem('pw', pw);
        document.getElementById('login-overlay').style.display='none';
        document.getElementById('main-content').style.display='block';
        loadState();
    }
}

async function loadState(){
    const res = await fetch('/api/state', {headers: apiHeaders()});
    const data = await res.json();

    currentYear = data.currentYear;
    currentMonth = data.currentMonth;

    document.getElementById('time-display').innerText =
        `${currentYear}年${currentMonth}月`;

    renderTable(data.concubines);
}

function autoResize(el){
    el.style.height = 'auto';
    el.style.height = el.scrollHeight + 'px';
}

async function updateConcubine(id, fields){
    const res = await fetch('/api/concubine/update',{
        method:'POST',
        headers: apiHeaders(),
        body: JSON.stringify({id, ...fields})
    });

    const data = await res.json();
    renderTable(data.concubines);
}

async function handleDelete(id, name){
    if(!confirm(`确定删除【${name}】？不可恢复！`)) return;

    const res = await fetch('/api/concubine/delete',{
        method:'POST',
        headers: apiHeaders(),
        body: JSON.stringify({id})
    });

    const data = await res.json();
    renderTable(data.concubines);
}

function renderTable(concubines){

    const tbody = document.getElementById('concubine-table-body');
    tbody.innerHTML = '';

    concubines.forEach(c=>{

        const tr = document.createElement('tr');

        const titleOptions = titlesOrder.map(t =>
            `<option value="${t}" ${c.title===t?'selected':''}>${t}</option>`
        ).join('');

        tr.innerHTML = `
            <td><b>${c.name}</b></td>

            <td>
                <select onchange="updateConcubine(${c.id},{title:this.value})">
                    ${titleOptions}
                </select>
            </td>

            <td>${c.enterYear}年${c.enterMonth}月</td>

            <td>
                <b>${c.lianShiCount || 0}</b>
                <button onclick="updateConcubine(${c.id},{lianShiCount:(c.lianShiCount||0)+1})">+</button>
            </td>

            <td>
                <button class="btn btn-danger"
                    onclick="handleDelete(${c.id},'${c.name.replace(/'/g,"\\'")}')">
                    删除
                </button>
            </td>

            <td>
                <textarea
                    oninput="autoResize(this)"
                    onchange="updateConcubine(${c.id},{note:this.value})"
                >${c.note || ''}</textarea>
            </td>
        `;

        tbody.appendChild(tr);
    });
}

window.onload = () => {
    const saved = sessionStorage.getItem('pw');
    if(saved){
        sessionPassword = saved;
        document.getElementById('login-overlay').style.display='none';
        document.getElementById('main-content').style.display='block';
        loadState();
    }
};
</script>

</body>
</html>

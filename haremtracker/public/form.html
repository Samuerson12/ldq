<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>新增妃子入宫</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 40px; background: #f5f6fa; color: #333; }
        .form-container { max-width: 500px; background: #fff; padding: 30px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin: 0 auto; }
        h2 { margin-top: 0; margin-bottom: 20px; color: #2c3e50; border-bottom: 2px solid #3498db; padding-bottom: 10px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: 600; color: #555; }
        input[type="text"], input[type="number"], select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; font-size: 14px; }
        .btn-group { display: flex; gap: 10px; margin-top: 25px; }
        .btn { flex: 1; padding: 12px; cursor: pointer; color: white; border: none; border-radius: 4px; font-weight: 500; font-size: 15px; text-align: center; }
        .btn-success { background: #2ecc71; }
        .btn-success:hover { background: #27ae60; }
        .btn-secondary { background: #7f8c8d; }
        .btn-secondary:hover { background: #95a5a6; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>小主入宫选秀登记</h2>
        <form id="add-form">
            <div class="form-group">
                <label>姓名 / 称呼</label>
                <input type="text" id="name" required placeholder="例如：钮祜禄·甄嬛">
            </div>
            <div class="form-group">
                <label>初始位份</label>
                <select id="title"></select>
            </div>
            <div class="form-group">
                <label>入宫年份 (年)</label>
                <input type="number" id="enterYear" value="" min="1" required>
            </div>
            <div class="form-group">
                <label>入宫月份 (月)</label>
                <input type="number" id="enterMonth" value="" min="1" max="12" required>
            </div>
            <div class="btn-group">
                <button type="submit" class="btn btn-success">确认册封入宫</button>
                <button type="button" class="btn btn-secondary" onclick="window.location.href='index.html'">取消返回</button>
            </div>
        </form>
    </div>

    <script>
        const titlesOrder = ["官女子", "答应", "常在", "贵人", "嫔", "妃", "贵妃", "皇贵妃", "皇后"];
        const titleCaps = { "皇后": 1, "皇贵妃": 1, "贵妃": 2, "妃": 4 };

        const sessionPassword = sessionStorage.getItem('pw');
        if (!sessionPassword) window.location.href = 'index.html';

        function apiHeaders() {
            return { 'Content-Type': 'application/json', 'x-password': sessionPassword };
        }

        async function populateTitleDropdown() {
            const res = await fetch('/api/state', { headers: apiHeaders() });
            if (res.status === 401) { window.location.href = 'index.html'; return; }
            const data = await res.json();
            const living = data.concubines.filter(c => !c.deceased);

            const select = document.getElementById('title');
            select.innerHTML = '';
            titlesOrder.forEach(t => {
                if (titleCaps[t]) {
                    const occupied = living.filter(c => c.title === t).length;
                    if (occupied >= titleCaps[t]) return;
                }
                const opt = document.createElement('option');
                opt.value = t;
                opt.textContent = t;
                select.appendChild(opt);
            });
        }

        document.getElementById('add-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const payload = {
                name: document.getElementById('name').value,
                title: document.getElementById('title').value,
                enterYear: document.getElementById('enterYear').value,
                enterMonth: document.getElementById('enterMonth').value,
            };
            const res = await fetch('/api/concubine/add', {
                method: 'POST',
                headers: apiHeaders(),
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) window.location.href = 'index.html';
        });

        window.onload = populateTitleDropdown;
    </script>
</body>
</html>
